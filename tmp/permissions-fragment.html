<template v-else-if="page==='permissions'">
<div class="management-hero"><div><span class="eyebrow">ACCESS CONTROL</span><h2>{{tr('إدارة صلاحيات الموظفين')}}</h2><p>{{tr('تحكم بكل إجراء، وحدد نطاق البيانات لكل موظف. المنع المخصص يتقدم على صلاحيات الدور.')}}</p></div><span class="hero-symbol">⊞</span></div>
<div class="notice">{{tr('الصلاحيات مطبقة داخل النسخة المحلية. الحماية بين مستخدمين حقيقيين تتطلب مصادقة وفرض هذه القواعد على الخادم.')}}</div>
<div class="card permission-selector"><label>{{tr('الموظف')}}<select v-model="permissionUser" @change="loadPermissions"><option v-for="u in permissionUsers" :value="u.id">{{u.name}} · {{tr(displayField(u,{key:'role'}))}}</option></select></label><div class="actions"><button class="btn" v-permit="can('users.create')" @click="go('users');openEdit()">＋ {{tr('موظف جديد')}}</button><button class="btn" v-permit="can('permissions.export')" @click="exportPermissions">{{tr('تصدير الصلاحيات')}}</button></div></div>
<template v-if="permissionTarget"><div class="metrics permission-summary"><div class="card metric"><span class="metriclabel">{{tr('صلاحيات مسموحة')}}</span><strong class="metricvalue">{{money(permissionStats.allowed)}}</strong></div><div class="card metric"><span class="metriclabel">{{tr('صلاحيات ممنوعة')}}</span><strong class="metricvalue">{{money(permissionStats.denied)}}</strong></div><div class="card metric"><span class="metriclabel">{{tr('تغييرات غير محفوظة')}}</span><strong class="metricvalue">{{money(permissionStats.changes)}}</strong></div></div>
<div class="card scope-card"><div class="cardhead"><div><h2>{{tr('نطاق البيانات')}}</h2><p class="help">{{tr('منح الإجراء لا يمنح الوصول إلى وكلاء خارج النطاق المحدد.')}}</p></div><label class="inline-check"><input type="checkbox" :checked="!!permissionDraft.scope" :disabled="!permissionEditable||!can('permissions.scope')" @change="setCustomScope($event.target.checked)">{{tr('نطاق مخصص')}}</label></div><template v-if="permissionDraft.scope"><div class="scope-options"><label v-for="a in visibleAgents" class="inline-check"><input type="checkbox" v-model="permissionDraft.scope.roots" :value="a.id" :disabled="!permissionEditable||!can('permissions.scope')">{{a.name}}</label></div><label class="inline-check"><input type="checkbox" v-model="permissionDraft.scope.descendants" :disabled="!permissionEditable||!can('permissions.scope')">{{tr('تضمين الوكلاء الفرعيين')}}</label></template><p v-else class="help">{{tr('حسب نطاق الدور الحالي')}}: {{permissionTarget.role==='owner'?tr('كل الوكلاء'):(permissionTarget.assigned||[permissionTarget.agent]).map(a=>nameOf('agents',a)).join('، ')}}</p></div>
<div class="card permission-controls"><div class="formgrid"><label>{{tr('البحث في الصلاحيات')}}<input v-model="permissionSearch" :placeholder="tr('اسم الوحدة أو الإجراء أو رمز الصلاحية')"></label><label>{{tr('طريقة العرض')}}<select v-model="permissionMode"><option value="all">{{tr('كل الصلاحيات')}}</option><option value="sensitive">{{tr('الإجراءات الحساسة')}}</option><option value="changed">{{tr('التخصيصات فقط')}}</option></select></label><label>{{tr('قالب صلاحيات')}}<select v-model="permissionTemplate" :disabled="!permissionEditable"><option value="reader">{{tr('قراءة وتقارير')}}</option><option value="cashier">{{tr('موظف مبيعات')}}</option><option value="accountant">{{tr('مراجع مالي')}}</option><option value="support">{{tr('موظف دعم')}}</option></select></label><div class="actions"><button class="btn" :disabled="!permissionEditable" @click="applyPermissionTemplate">{{tr('تطبيق القالب على المسودة')}}</button></div></div><p class="help">{{tr('القالب يستبدل تخصيصات المسودة. لا تحفظ التغييرات إلا بعد مراجعتها وتأكيدها.')}}</p></div>
<div v-if="!permissionEditable" class="notice">{{tr('عرض فقط: لا يمكن تعديل حسابك الحالي أو حساب مدير النظام.')}}</div>
<div class="permission-grid"><details v-for="group in permissionGroups" :key="group.module" class="card permission-module" open><summary><span>{{tr(group.title)}}</span><span class="badge">{{group.items.filter(p=>permissionEffective(p.key)).length}} / {{group.items.length}}</span></summary><div class="permission-bulk"><button class="btn small" :disabled="!permissionEditable" @click="setPermissionGroup(group,'allow')">{{tr('سماح للمجموعة')}}</button><button class="btn small" :disabled="!permissionEditable" @click="setPermissionGroup(group,'deny')">{{tr('منع للمجموعة')}}</button><button class="btn ghost small" :disabled="!permissionEditable" @click="setPermissionGroup(group,'inherit')">{{tr('حسب الدور')}}</button></div><div v-for="p in group.items" class="permission-row"><div><b>{{tr(p.label)}}</b><span v-if="p.sensitive" class="sensitive-dot" :title="tr('إجراء حساس')">●</span><code>{{p.key}}</code><small>{{tr('الدور')}}: {{tr(permissionDefault(p.key)?'سماح':'منع')}}</small></div><div class="permission-choice"><select :value="permissionDraft.overrides[p.key]||'inherit'" :disabled="!permissionEditable" :aria-label="tr(group.title+' • '+p.label)" @change="setPermission(p.key,$event.target.value)"><option value="inherit">{{tr('حسب الدور')}}</option><option value="allow" :disabled="!can(p.key)">{{tr('سماح')}}</option><option value="deny">{{tr('منع')}}</option></select><span class="badge" :class="{bad:!permissionEffective(p.key)}">{{tr(permissionEffective(p.key)?'مسموح فعليًا':'ممنوع فعليًا')}}</span></div></div></details></div>
<div v-if="!permissionGroups.length" class="empty">{{tr('لا توجد نتائج مطابقة')}}</div><div class="card permission-save"><label>{{tr('سبب التغيير')}}<textarea v-model="permissionReason" :disabled="!permissionEditable" :placeholder="tr('اذكر سبب منح أو سحب الصلاحيات')"></textarea></label><div class="actions"><button class="btn" @click="loadPermissions">{{tr('إلغاء التغييرات')}}</button><button class="btn primary" :disabled="!permissionEditable||!permissionStats.changes||!permissionReason.trim()" @click="reviewPermissions">{{tr('مراجعة وحفظ الصلاحيات')}} · {{permissionStats.changes}}</button></div></div></template></template>
