<template v-if="modal.kind==='profileReview'"><div class="notice"><b>{{modal.draft.name}}</b><p>{{modal.draft.permissions.length}} {{tr('صلاحية محددة')}} · {{modal.count}} {{tr('موظف مرتبط')}}</p></div><p v-if="modal.count" class="help">{{tr('سيطبق التعديل على جميع الموظفين المرتبطين بهذا النوع.')}}</p><p v-if="modal.reason">{{modal.reason}}</p><div class="permission-review-list"><div v-for="c in modal.changes"><b>{{tr(c.label)}}</b><span class="badge" :class="{bad:!c.allow}">{{tr(c.allow?'سماح':'منع')}}</span></div></div><div class="formfoot"><button class="btn" @click="closeModal">{{tr('رجوع')}}</button><button class="btn primary" @click="savePermissionProfile">{{tr('تأكيد حفظ نوع الصلاحية')}}</button></div></template>
<form v-else-if="modal.kind==='staff'" @submit.prevent="saveStaff"><div class="formgrid staff-form"><label>{{tr('اسم الموظف')}}<input v-model="staffForm.name" name="employee-name" autocomplete="name" required maxlength="120"></label><label>{{tr('البريد الإلكتروني')}}<input v-model="staffForm.email" name="employee-email" type="email" dir="ltr" autocomplete="email" required></label><label>{{tr(staffForm.id?'كلمة مرور جديدة':'كلمة المرور')}}<div class="staff-password"><input v-model="staffForm.password" name="employee-password" :type="staffShowPassword?'text':'password'" dir="ltr" autocomplete="new-password" :required="!staffForm.id" minlength="8" :placeholder="tr(staffForm.id?'اتركها فارغة للإبقاء على كلمة المرور':'8 أحرف على الأقل')"><button type="button" class="btn small" @click="staffShowPassword=!staffShowPassword" :aria-pressed="staffShowPassword">{{tr(staffShowPassword?'إخفاء':'إظهار')}}</button></div></label><label>{{tr('نوع الصلاحية')}}<select v-model="staffForm.permissionProfileId" name="employee-permission" :required="staffForm.role==='employee'" :disabled="staffForm.id===currentUser||staffForm.role==='owner'"><option value="">{{tr(staffForm.role==='employee'?'اختر نوع الصلاحية':'صلاحيات الدور الحالي')}}</option><option v-for="p in assignableProfiles" :value="p.id">{{p.name}}</option><option v-if="staffForm.permissionProfileId&&!assignableProfiles.some(p=>p.id===staffForm.permissionProfileId)" :value="staffForm.permissionProfileId">{{permissionProfiles.find(p=>p.id===staffForm.permissionProfileId)?.name}} · {{tr('موقوف')}}</option></select></label></div><p class="help">{{tr('أنشئ نوع الصلاحية من شاشة أنواع الصلاحيات، ثم اختره للموظف.')}}</p><details v-if="['employee','supervisor'].includes(staffForm.role)" class="staff-scope"><summary>{{tr('نطاق بيانات الموظف')}} <span class="badge">{{staffForm.assigned.length}}</span></summary><p class="help">{{tr('حدد الوكلاء الذين يستطيع الموظف الوصول إلى بياناتهم. دون اختيار لن تظهر له بيانات وكلاء.')}}</p><div class="scope-options"><label v-for="a in visibleAgents" class="inline-check"><input type="checkbox" v-model="staffForm.assigned" :value="a.id">{{a.name}}</label></div><label class="inline-check"><input type="checkbox" v-model="staffForm.includeDescendants">{{tr('تضمين الوكلاء الفرعيين')}}</label></details><div class="formfoot"><button type="button" class="btn" @click="closeModal">{{tr('إلغاء')}}</button><button class="btn primary" :disabled="staffSaving">{{tr(staffSaving?'جارٍ الحفظ…':'حفظ الموظف')}}</button></div></form>
