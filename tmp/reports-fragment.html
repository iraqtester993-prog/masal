<template v-else-if="page==='reports'">
<div class="management-hero"><div><span class="eyebrow">BUSINESS INTELLIGENCE</span><h2>{{tr('مركز التقارير الشامل')}}</h2><p>{{tr('رؤية تفصيلية للمبيعات والمخزون والمحافظ والشبكة والتشغيل ضمن صلاحيات حسابك.')}}</p></div><span class="hero-symbol">↗</span></div>
<div class="card report-filters"><div class="cardhead"><h2>{{tr('إعداد التقرير')}}</h2><button class="btn ghost small" @click="resetReport">{{tr('إعادة ضبط')}}</button></div><div class="report-presets"><button v-for="p in [['today','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر'],['all','كل الفترات']]" class="btn small" @click="reportPreset(p[0])">{{tr(p[1])}}</button></div><div class="report-filter-grid"><label>{{tr('من')}}<input type="date" v-model="reportFrom"></label><label>{{tr('إلى')}}<input type="date" v-model="reportTo"></label><label>{{tr('نوع التقرير')}}<select v-model="reportKind"><option value="all">{{tr('التقرير الشامل')}}</option><option v-for="t in reportTypes" :value="t.id">{{tr(t.label)}}</option></select></label><label>{{tr('الوكيل')}}<select v-model="reportAgent"><option value="">{{tr('كل النطاق المسموح')}}</option><option v-for="a in visibleAgents" :value="a.id">{{a.name}}</option></select></label><label>{{tr('نقطة البيع')}}<select v-model="reportPOS"><option value="">{{tr('الكل')}}</option><option v-for="p in visiblePOS.filter(p=>!reportAgent||engine.descendants(reportAgent).includes(p.agent))" :value="p.id">{{p.name}}</option></select></label><label>{{tr('المنتج')}}<select v-model="reportProduct"><option value="">{{tr('الكل')}}</option><option v-for="p in s.products" :value="p.id">{{p.name}}</option></select></label><label>{{tr('المزود')}}<select v-model="reportProvider"><option value="">{{tr('الكل')}}</option><option v-for="p in s.providers" :value="p.id">{{p.name}}</option></select></label><label>{{tr('المحافظة')}}<select v-model="reportCity"><option value="">{{tr('الكل')}}</option><option v-for="c in [...new Set(visiblePOS.map(p=>p.city))]" :value="c">{{c}}</option></select></label><label>{{tr('حالة البيع')}}<select v-model="reportStatus"><option value="">{{tr('الكل')}}</option><option v-for="x in ['Print Requested','Print Failed','Printed','Reprinted','Reprint Requested']" :value="x">{{tr(status(x))}}</option></select></label></div><p class="help">{{tr('التاريخ يرشح الحركات. الحالة تخص المبيعات فقط. المنتج والمزود يرشحان المبيعات والمخزون والأسعار. المخزون والشبكة والإعدادات لقطات حالية.')}}</p></div>
<div v-if="reportBundle.error" class="notice warn" role="alert">{{tr(reportBundle.error)}}</div><template v-else><div class="metrics report-kpis"><div v-for="m in reportKpis" class="card metric"><span class="metriclabel">{{tr(m.label)}}</span><strong class="metricvalue">{{money(m.value)}}</strong></div></div>
<div class="report-export-bar"><span class="help">{{reportSections.length}} {{tr('أقسام التقرير')}} · {{tr('بتوقيت بغداد')}}</span><div class="actions"><button class="btn" v-permit="can('reports.export')" @click="exportReport(true)">{{tr('تصدير كل الأقسام CSV')}}</button><button class="btn" v-permit="can('reports.export')" @click="downloadReportDocument">{{tr('تنزيل التقرير المنسق')}}</button><button class="btn primary" v-permit="can('reports.print')" @click="printReport">{{tr('طباعة / حفظ PDF')}}</button></div></div>
<div class="report-workspace"><nav class="report-nav" :aria-label="tr('أقسام التقرير')"><button v-for="section in reportSections" :class="{active:reportActive?.id===section.id}" @click="selectReport(section.id)"><span>{{tr(section.title)}}</span><b>{{money(section.rows.length)}}</b></button></nav><div v-if="reportActive" class="card report-table-card"><div class="cardhead"><div><h2>{{tr(reportActive.title)}}</h2><p class="help">{{tr(reportActive.note)}}</p></div><span class="badge">{{money(reportFilteredRows.length)}} {{tr('سجل')}}</span></div><div class="report-table-tools"><input v-model="reportSearch" :placeholder="tr('بحث داخل التقرير')" :aria-label="tr('بحث داخل التقرير')"><details class="column-picker"><summary class="btn">{{tr('الأعمدة')}}</summary><div><label v-for="c in reportActive.columns" class="inline-check"><input type="checkbox" :checked="!reportHidden.includes(c.key)" @change="$event.target.checked?reportHidden=reportHidden.filter(k=>k!==c.key):reportHidden.push(c.key)">{{tr(c.label)}}</label></div></details><button class="btn small" v-permit="can('reports.export')" @click="exportReport(false)">{{tr('تصدير الجدول الحالي')}}</button></div><div class="tablewrap"><table><thead><tr><th v-for="c in reportColumns"><button class="table-sort" @click="sortReport(c.key)">{{tr(c.label)}} <span aria-hidden="true">{{reportSort.key===c.key?(reportSort.direction===1?'↑':'↓'):'↕'}}</span></button></th></tr></thead><tbody><tr v-for="(row,i) in reportVisibleRows" :key="reportActive.id+'-'+i"><td v-for="c in reportColumns" :class="{'mono':c.type==='money'||c.type==='number','positive':c.key==='profit'&&row[c.key]>0,'negative':c.key==='profit'&&row[c.key]<0}">{{reportCell(row[c.key],c)}}</td></tr></tbody></table></div><div v-if="!reportFilteredRows.length" class="empty">{{tr('لا توجد سجلات ضمن الفلاتر الحالية')}}</div><div class="report-pagination"><label>{{tr('عدد السجلات')}}<select v-model.number="reportPageSize"><option :value="25">25</option><option :value="50">50</option><option :value="100">100</option></select></label><span>{{Math.min(reportPage,reportPageCount)}} / {{reportPageCount}}</span><div class="actions"><button class="btn small" :disabled="reportPage<=1" @click="reportPage--">{{tr('السابق')}}</button><button class="btn small" :disabled="reportPage>=reportPageCount" @click="reportPage++">{{tr('التالي')}}</button></div></div></div><div v-else class="card empty">{{tr('لا توجد أقسام تقارير مسموحة لهذا الحساب')}}</div></div></template></template>
