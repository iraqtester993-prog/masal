<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماسال • فك تشفير ملف</title><style>body{background:#f4f7fc;color:#0b1e36;font:15px Tahoma,sans-serif;display:grid;place-items:center;min-height:95vh;margin:0}.card{background:#fff;padding:32px;border:1px solid #e2e8f0;border-radius:20px;width:min(460px,80vw)}p{line-height:1.9;color:#64748b;font-size:13px}label{display:block;margin-top:22px;font-size:13px}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9e2ec;border-radius:9px;margin-top:10px}button{margin-top:22px;background:#0f766e;border:0;border-radius:9px;color:#fff;padding:13px;width:100%;cursor:pointer;font:inherit}#message{color:#b43b50;overflow-wrap:anywhere}a{color:#0284c7}</style></head><body><main class="card"><h1>فك تشفير ملف ماسال</h1><p>اختر الملف المشفر واكتب كلمة مروره. تُنفذ العملية على جهازك دون رفع الملف إلى أي خادم.</p><form id="form"><label>ملف الدفعة<input id="file" type="file" accept=".json" required></label><label>كلمة المرور<input id="password" type="password" required autocomplete="off"></label><button id="submit">فك التشفير وتنزيل المحتوى</button></form><p id="message" role="status"></p><p><a href="index.html">العودة إلى النظام</a></p></main><script>
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const message=document.querySelector('#message'),button=document.querySelector('#submit');button.disabled=true;message.textContent='جارٍ فك التشفير…';try{if(!crypto.subtle)throw Error('استخدم متصفح Edge أو Chrome حديثًا');const file=document.querySelector('#file').files[0];if(file.size>15000000)throw Error('حجم الملف أكبر من الحد المسموح');const envelope=JSON.parse(await file.text());if(!['masal-encrypted-v1','masal-backup-encrypted-v1'].includes(envelope.format)||(envelope.format==='masal-encrypted-v1'&&(envelope.iterations!==210000||envelope.algorithm!=='AES-256-GCM')))throw Error('صيغة الملف غير مدعومة');const bytes=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));const password=document.querySelector('#password').value;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(envelope.salt),iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv)},key,bytes(envelope.data));const link=document.createElement('a'),url=URL.createObjectURL(new Blob([plain],{type:envelope.format==='masal-encrypted-v1'?'text/csv;charset=utf-8':'application/json'}));link.href=url;link.download=file.name.replace('.encrypted.json',envelope.format==='masal-encrypted-v1'?'.csv':'.json');link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message.textContent='تم فك التشفير وتنزيل الملف.';document.querySelector('#password').value='';}catch(error){message.textContent=error.name==='OperationError'?'كلمة المرور غير صحيحة أو الملف تالف.':error.message}finally{button.disabled=false}});
</script></body></html>
